<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Classic Sonic Level List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" data-tab="home">Home</button>
    <button class="tab-btn" data-tab="list">List</button>
    <button class="tab-btn" data-tab="pending">Pending</button>
    <button class="tab-btn" data-tab="allowed">Allowed Mods</button>
    <button class="tab-btn" data-tab="leaderboard">Leaderboard</button>
  </div>

  <div id="home" class="tab-content active">
    <h1>THE OFFICIAL CLASSIC SONIC LEVEL LIST</h1>
    <p>Welcome To The Classic Sonic Level List, A Ranking Of The Hardest Classic Sonic Levels, Inspired By The Geometry Dash Demonlist And The FNAF Maxmode List.</p>
  </div>

  <div id="list" class="tab-content">
    <h1>Level List</h1>
    <div id="list-container"></div>
    <div id="level-page" class="level-page"></div>
  </div>

  <div id="pending" class="tab-content">
    <h1>Pending Levels</h1>
    <div id="pending-container"></div>
  </div>

  <div id="allowed" class="tab-content">
    <h1>Allowed Mods</h1>
    <div id="allowed-container"></div>
  </div>

  <div id="leaderboard" class="tab-content">
    <h1>Leaderboard</h1>
    <div id="leaderboard-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
